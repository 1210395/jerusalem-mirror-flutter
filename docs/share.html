<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Heritage Reflection — Jerusalem Heritage AI Mirror</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #131407;
    color: #e4e4cc;
    font-family: 'Montserrat', system-ui, sans-serif;
    min-height: 100vh;
  }
  body {
    background: radial-gradient(ellipse at top, #1f2111 0%, #131407 50%, #0e0f03 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 20px 48px;
  }
  .brand {
    color: #d4af37;
    letter-spacing: 6px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    color: #f2ca50;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 600;
    margin: 0 0 4px;
    text-align: center;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
  }
  .costume {
    color: #d0c5af;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    margin-bottom: 32px;
    text-align: center;
  }
  .frame {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    border: 2px solid rgba(212, 175, 55, 0.4);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(212, 175, 55, 0.2), 0 8px 32px rgba(0, 0, 0, 0.6);
    background: #1b1d0e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .frame .placeholder {
    color: #99907c;
    font-size: 0.85rem;
    text-align: center;
    padding: 24px;
  }
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 24px;
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #d4af37 0%, #f2ca50 100%);
    color: #3c2f00;
    box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35);
  }
  .btn-primary:hover { box-shadow: 0 8px 32px rgba(212, 175, 55, 0.5); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost {
    background: rgba(255, 255, 255, 0.05);
    color: #d0c5af;
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }
  .footer {
    margin-top: 40px;
    color: #99907c;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }
  .footer .ar {
    font-family: 'Amiri', serif;
    font-size: 1rem;
    letter-spacing: 0;
    color: #d4af37;
    margin-top: 8px;
  }
  .error {
    color: #ffb4a8;
    text-align: center;
    margin: 32px 0;
  }
</style>
</head>
<body>
<div class="brand">Jerusalem Heritage AI Mirror</div>
<h1 id="title">Your Heritage Reflection</h1>
<div class="costume" id="costume"></div>
<div class="frame">
  <img id="img" alt="Your AI-generated heritage reflection" style="display:none">
  <div class="placeholder" id="placeholder">Loading your reflection…</div>
</div>
<div class="actions">
  <a id="download" class="btn btn-primary" download="jerusalem-heritage.jpg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Download Image
  </a>
  <a id="open" class="btn btn-ghost" target="_blank" rel="noopener">
    Open in Browser
  </a>
</div>
<div class="footer">
  Created with Jerusalem Heritage AI Mirror
  <div class="ar">مرآة تراث القدس</div>
</div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var imgUrl = params.get('img');
    var name = params.get('name');

    if (name) {
      document.getElementById('costume').textContent = decodeURIComponent(name);
    }

    var img = document.getElementById('img');
    var placeholder = document.getElementById('placeholder');
    var download = document.getElementById('download');
    var open = document.getElementById('open');

    if (!imgUrl) {
      placeholder.innerHTML = '<div class="error">No image link provided.<br>Open this page from the QR code in the app.</div>';
      download.style.display = 'none';
      open.style.display = 'none';
      return;
    }

    img.onload = function () {
      img.style.display = 'block';
      placeholder.style.display = 'none';
    };
    img.onerror = function () {
      placeholder.innerHTML = '<div class="error">Could not load image.<br>The link may have expired.</div>';
    };
    img.src = imgUrl;
    download.href = imgUrl;
    open.href = imgUrl;
  })();
</script>
</body>
</html>
