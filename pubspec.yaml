name: jerusalem_mirror
description: "Jerusalem Heritage AI Mirror - Step into Jerusalem's living history."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.10.6
  http: ^1.3.0
  video_player: ^2.9.0
  path_provider: ^2.1.0
